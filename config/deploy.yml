# =============================================================================
# Kamal 2.x Deploy Configuration - JustJeeps API Backend
# =============================================================================

service: justjeeps-api

image: <%= ENV.fetch('KAMAL_REGISTRY_USERNAME') %>/justjeeps-api

# =============================================================================
# SERVIDORES
# =============================================================================
servers:
  web:
    hosts:
      - 138.197.173.222
    labels:
      traefik.http.routers.justjeeps-api.rule: Host(`pricingtoolapi.justjeeps.com`)
      traefik.http.routers.justjeeps-api-secure.entrypoints: websecure
      traefik.http.routers.justjeeps-api-secure.rule: Host(`pricingtoolapi.justjeeps.com`)
      traefik.http.routers.justjeeps-api-secure.tls: true
      traefik.http.routers.justjeeps-api-secure.tls.certresolver: letsencrypt
    options:
      memory: 2g
      cpus: 1

# =============================================================================
# PROXY (Traefik)
# =============================================================================
proxy:
  ssl: true
  host: pricingtoolapi.justjeeps.com
  app_port: 8080
  response_timeout: 120
  healthcheck:
    path: /api/health
    interval: 10
    timeout: 30

# =============================================================================
# REGISTRY
# =============================================================================
registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

# =============================================================================
# VARIAVEIS DE AMBIENTE
# =============================================================================
env:
  clear:
    PORT: 8080
    NODE_ENV: production
    ENABLE_AUTH: "true"
    # Papel do processo p/ sizing do pool Prisma (lib/prisma.js). Children de
    # seed spawned pelo server/seed-all sobrescrevem para "seed".
    APP_ROLE: api
    CRON_ENABLED: "true"
    CRON_TIMEZONE: America/Toronto
    CRON_COMMAND_NOTIFY_ON_SUCCESS: "false"
    CRON_SEED_ALL_ENABLED: "true"
    # :32 para nao colidir com o seed-orders-delta (*/5) no mutex global de
    # command crons — em 20/jul a rodada das 7:30 foi PULADA porque o delta
    # pegou o lock no mesmo segundo. Remover apos a Fase 4 (filas pg-boss).
    CRON_SEED_ALL_SCHEDULE: "32 7,19 * * *"
    CRON_SEED_ALL_PRODUCTS_ENABLED: "false"
    CRON_SEED_ALL_PRODUCTS_SCHEDULE: "45 */6 * * *"
    CRON_SEED_MEYER_ENABLED: "false"
    CRON_SEED_MEYER_SCHEDULE: "7 */4 * * *"
    CRON_SEED_ROUGH_COUNTRY_ENABLED: "false"
    CRON_SEED_ROUGH_COUNTRY_SCHEDULE: "37 */4 * * *"
    # Nomes historicos enganosos: "PRIORITY" controla o job magento-attributes-daily
    # (Rough Country + KeyParts) e "ROUGH" controla o magento-attributes-weekly
    # (Omix + AEV + MetalCloak). Ver getCronJobDefinitions em server.js.
    CRON_MAGENTO_ATTRIBUTES_PRIORITY_ENABLED: "true"
    CRON_MAGENTO_ATTRIBUTES_PRIORITY_SCHEDULE: "20 2 * * *"
    CRON_MAGENTO_ATTRIBUTES_ROUGH_ENABLED: "true"
    CRON_MAGENTO_ATTRIBUTES_ROUGH_SCHEDULE: "45 17 * * 0"
    MAGENTO_MAX_SAFE_CONCURRENCY: "1"
    MAGENTO_MAX_SAFE_BATCH_SIZE: "100"
    MAGENTO_HTTPS_MAX_SOCKETS: "10"
    MAGENTO_MAX_RETRIES: "1"
    MAGENTO_CHUNK_DELAY_MS: "1000"
    MAGENTO_BATCH_DELAY_MS: "1000"
    CRON_SKU_COST_ALERT_ENABLED: "true"
    CRON_SKU_COST_ALERT_SCHEDULE: "30 1 * * *"
    SKU_COST_ALERT_SKU: "TH-635801"
    SKU_COST_ALERT_VENDOR: "Meyer"
    CRON_CAD_US_WEEKLY_ENABLED: "true"
    CRON_CAD_US_WEEKLY_SCHEDULE: "30 6 * * 0"
    CRON_TEST_ENABLED: "true"
    
    CRON_TEST_SCHEDULE: "5,35 * * * *"
    CRON_TEST_COMMAND: seed-orders
    CRON_TEST_JOB_NAME: Orders Update Test (30 min)
    CRON_TEST_LOG_FILE: prisma/seeds/logs/seed-orders-30min-test.log
    CRON_TEST_NOTIFY_ON_SUCCESS: "false"
    SEED_ORDER_LIMIT: "200"
    CRON_CANCELLATION_REPORT_ENABLED: "true"
    CRON_CANCELLATION_REPORT_SCHEDULE: "59 23 * * *"
    CRON_CANCELLATION_REPORT_TIMEZONE: America/Toronto
    CRON_SKU_STATUS_REPORT_ENABLED: "true"
    CRON_SKU_STATUS_REPORT_SCHEDULE: "0 22 * * *"
    CRON_SKU_STATUS_REPORT_TIMEZONE: America/Toronto
    CRON_SKU_STATUS_WEEKLY_REPORT_ENABLED: "true"
    CRON_SKU_STATUS_WEEKLY_REPORT_SCHEDULE: "0 18 * * 5"
    CRON_SKU_STATUS_WEEKLY_REPORT_TIMEZONE: America/Toronto
    CRON_DIGEST_ENABLED: "true"
    CRON_DIGEST_SCHEDULE: "10 0 * * *"
    CRON_DIGEST_TIMEZONE: America/Toronto
    # QuickBooks customer lookup: dados servidos do Postgres (importados via
    # seed-quickbooks-customers). "csv" = fallback legado lendo os CSVs do
    # volume quickbooks-inbox. Ver docs/QUICKBOOKS-DATA-REFRESH.md.
    QB_LOOKUP_SOURCE: "db"
    QB_LOOKUP_DATA_DIR: "/data/quickbooks-customers"
    CRON_QB_FRESHNESS_REPORT_ENABLED: "true"
    CRON_QB_FRESHNESS_REPORT_SCHEDULE: "15 9 * * *"
    QB_STALE_WARN_DAYS: "14"
    QB_STALE_CRIT_DAYS: "30"
    CRON_HISTORY_LOOKBACK_DAYS: "30"
    CRON_HISTORY_RETENTION_DAYS: "90"
    CRON_LOG_TAIL_LINES: "300"
    JWT_EXPIRES_IN: 24h
    PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    # Roteamento de e-mail NAO e secret: fica em clear para nunca resolver
    # vazio por shell sem source (incidente ECONNREFUSED 127.0.0.1:587 de
    # 20/jul — container subiu com SMTP_HOST vazio e o nodemailer caiu no
    # default localhost:587). Credenciais continuam em secret.
    EMAIL_PROVIDER: smtp
    EMAIL_FROM: JustJeeps API <webdev@justjeeps.com>
    SMTP_HOST: smtp-relay.brevo.com
    SMTP_PORT: "2525"
    SMTP_SECURE: "false"
    # Feeds de vendor no Spaces (bucket provisionado em 2026-08-05).
    # 4:47/16:47 = fora da grade */5 do delta e com folga antes do seed-all
    # (7:32/19:32) — mutex global de crons. O FTP da Keystone derruba
    # transfers longos (426): resume por byte + tentativas generosas.
    CRON_FEED_FETCH_KEYSTONE_ENABLED: "true"
    CRON_FEED_FETCH_KEYSTONE_SCHEDULE: "47 4,16 * * *"
    KEYSTONE_FTP_MAX_ATTEMPTS: "12"
    # CA intermediaria do FTPS da Keystone: o servidor manda so a folha, entao
    # o Node precisa do intermediario para montar a cadeia. Fica num diretorio
    # privado do bucket (nunca no repositorio); alternativa: KEYSTONE_FTP_CA_PEM
    # como secret com o conteudo do PEM.
    KEYSTONE_FTP_CA_OBJECT_KEY: certs/keystone-ftp-ca.pem
    # Quem pode o que: allowlists por env para nao exigir deploy de codigo
    # quando alguem entra ou sai do time (o codigo so tem o default).
    MAGENTO_STATUS_ALLOWED_USERS: "jerry,tess,jacob,david,rafael,ricardo,paula"
    ORDER_CANCEL_EXECUTE_ALLOWED_USERS: "tess,jerry,jacob,paula,karoline"
    ORDER_CANCEL_DRY_RUN_ALLOWED_USERS: "tess"
    ORDER_CANCEL_MANUAL_REFUND_RESTRICTED_USERS: "paula"
    ORDER_PO_INIT_ALLOWED_USERS: "tess,jerry,jacob,paula,karoline"
    PURCHASER_REPORT_ALLOWED_USERS: "tess,paula,karoline"
    ORDER_CANCELLATION_REPORT_ALLOWED_USERS: "tess,jerry,jacob,paula,karoline"
    # Origens aceitas pelo navegador (CORS da API). localhost so fora de prod.
    CORS_ALLOWED_ORIGINS: "https://pricingtool.justjeeps.com"
    FEED_CACHE_DIR: /app/feed-cache
    # Quem pode subir feed e usar o botao "Run now" do painel.
    FEEDS_TRIAGE_USERS: "ricardo,rafael"
  secret:
    # Database & Auth
    - DATABASE_URL
    - JWT_SECRET
    - USD_TO_CAD_RATE
    # Email credentials & notifications (roteamento nao-secreto esta em clear)
    - EMAIL_USER
    - EMAIL_PASSWORD
    - SMTP_USER
    - SMTP_PASSWORD
    - SENDGRID_API_KEY
    - BREVO_API_KEY
    - BREVO_FROM
    - CRON_NOTIFICATION_EMAIL
    - ORDER_CANCELLATION_REPORT_EMAILS
    - SKU_STATUS_REPORT_EMAILS
    - SKU_STATUS_WEEKLY_REPORT_EMAILS
    # Magento
    - MAGENTO_KEY
    # Keystone
    - KEYSTONE_KEY
    - KEYSTONE_ACCOUNT
    - KEYSTONE_ACCOUNT_DS
    - KEYSTONE_KEY_DS
    - KEYSTONE_FTP_USER
    - KEYSTONE_FTP_PASS
    # Meyer
    - MEYER_USERNAME
    - MEYER_PASSWORD
    - MEYER_KEY
    # Turn14
    - TURN14_CLIENT_ID
    - TURN14_CLIENT_SECRET
    - TURN14_ENVIRONMENT
    # Premier
    - PREMIER_API_KEY
    - PREMIER_BASE_URL
    # WheelPros
    - WHEELPROS_USER
    - WHEELPROS_PASS
    # Other APIs
    - PARSEHUB_KEY_NORTHRIDGE
    - FREIGHTCOM_API_KEY
    # DigitalOcean Spaces (feeds de vendor). Opcionais no pre-build: sem eles
    # o feed-sync so avisa e os seeds usam os arquivos locais existentes.
    - DO_SPACES_ENDPOINT
    - DO_SPACES_REGION
    - DO_SPACES_BUCKET
    - DO_SPACES_KEY
    - DO_SPACES_SECRET
    # Axiom (Error Monitoring)
    - AXIOM_TOKEN
    - AXIOM_DATASET

# =============================================================================
# SSH
# =============================================================================
ssh:
  user: root

# =============================================================================
# BUILDER
# =============================================================================
builder:
  arch: amd64
  dockerfile: Dockerfile.production
  context: .

volumes:
  - "/var/lib/justjeeps-api/logs:/app/logs"
  - "/var/lib/justjeeps-api/prisma-seeds-logs:/app/prisma/seeds/logs"
  # CSVs do audit/disable CAD-US precisam sobreviver a deploys (o disable le o
  # CSV gerado pelo audit). Antes do primeiro deploy com este volume, criar o
  # dir no host com o owner do user nodejs do container (mesmo uid dos volumes
  # de logs acima): mkdir -p /var/lib/justjeeps-api/reports && chown <uid>:<gid>
  - "/var/lib/justjeeps-api/reports:/app/reports"
  # Inbox dos exports do QuickBooks Desktop (customers_qb_desktop.csv +
  # transactions_per_customer.csv). Montado em path SEM espaco (o docker run do
  # Kamal nao faz quoting de volumes; "/app/QuickBooks Project/..." quebra o
  # deploy). O service resolve via env QB_LOOKUP_DATA_DIR. Bootstrap antes do
  # primeiro deploy: mkdir + copiar CSVs + chown no uid do nodejs. Refresh: scp
  # dos CSVs novos para o dir no host e rodar seed-quickbooks-customers.
  # Ver docs/QUICKBOOKS-DATA-REFRESH.md.
  - "/var/lib/justjeeps-api/quickbooks-inbox:/data/quickbooks-customers"
  # Cache local dos feeds de vendor materializados do Spaces (lib/feeds).
  # Puro cache: se o host perder o dir, o materializer redownloada do bucket.
  # Bootstrap antes do primeiro deploy: mkdir -p /var/lib/justjeeps-api/feed-cache
  # && chown <uid>:<gid> (mesmo uid do nodejs dos volumes acima).
  - "/var/lib/justjeeps-api/feed-cache:/app/feed-cache"
