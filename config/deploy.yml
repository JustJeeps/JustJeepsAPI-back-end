# =============================================================================
# Kamal 2.x Deploy Configuration - JustJeeps API Backend
# =============================================================================

service: justjeeps-api

image: <%= ENV.fetch('KAMAL_REGISTRY_USERNAME') %>/justjeeps-api

# =============================================================================
# SERVERS
# =============================================================================
servers:
  web:
    hosts:
      - 138.197.173.222
    labels:
      traefik.http.routers.justjeeps-api.rule: Host(`pricingtoolapi.justjeeps.com`)
      traefik.http.routers.justjeeps-api-secure.entrypoints: websecure
      traefik.http.routers.justjeeps-api-secure.rule: Host(`pricingtoolapi.justjeeps.com`)
      traefik.http.routers.justjeeps-api-secure.tls: true
      traefik.http.routers.justjeeps-api-secure.tls.certresolver: letsencrypt
    options:
      memory: 2g
      cpus: 1

# =============================================================================
# PROXY (Traefik)
# =============================================================================
proxy:
  ssl: true
  host: pricingtoolapi.justjeeps.com
  app_port: 8080
  response_timeout: 120
  healthcheck:
    path: /api/health
    interval: 10
    timeout: 30

# =============================================================================
# REGISTRY
# =============================================================================
registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

# =============================================================================
# ENVIRONMENT VARIABLES
# =============================================================================
env:
  clear:
    PORT: 8080
    NODE_ENV: production
    ENABLE_AUTH: "true"
    # Process role for sizing the Prisma pool (lib/prisma.js). Seed children
    # spawned by the server/seed-all override it to "seed".
    APP_ROLE: api
    CRON_ENABLED: "true"
    CRON_TIMEZONE: America/Toronto
    CRON_COMMAND_NOTIFY_ON_SUCCESS: "false"
    CRON_SEED_ALL_ENABLED: "true"
    # :32 so it does not collide with seed-orders-delta (*/5) on the global
    # mutex for command crons: on Jul 20 the 7:30 run was SKIPPED because the
    # delta grabbed the lock in the same second. Remove after Phase 4 (pg-boss
    # queues).
    CRON_SEED_ALL_SCHEDULE: "32 7,19 * * *"
    CRON_SEED_ALL_PRODUCTS_ENABLED: "false"
    CRON_SEED_ALL_PRODUCTS_SCHEDULE: "45 */6 * * *"
    CRON_SEED_MEYER_ENABLED: "false"
    CRON_SEED_MEYER_SCHEDULE: "7 */4 * * *"
    CRON_SEED_ROUGH_COUNTRY_ENABLED: "false"
    CRON_SEED_ROUGH_COUNTRY_SCHEDULE: "37 */4 * * *"
    # Misleading historical names: "PRIORITY" controls the magento-attributes-daily
    # job (Rough Country + KeyParts) and "ROUGH" controls magento-attributes-weekly
    # (Omix + AEV + MetalCloak). See getCronJobDefinitions in server.js.
    CRON_MAGENTO_ATTRIBUTES_PRIORITY_ENABLED: "true"
    # 02:23, not 02:20: the orders delta runs every five minutes, so :20 is a
    # tick it always wins, and this job was dropped every night from 2026-07-20
    # to 2026-08-10. The queue now defers instead of dropping, so this is only
    # to avoid a pointless daily wait.
    CRON_MAGENTO_ATTRIBUTES_PRIORITY_SCHEDULE: "23 2 * * *"
    CRON_MAGENTO_ATTRIBUTES_ROUGH_ENABLED: "true"
    CRON_MAGENTO_ATTRIBUTES_ROUGH_SCHEDULE: "45 17 * * 0"
    MAGENTO_MAX_SAFE_CONCURRENCY: "1"
    MAGENTO_MAX_SAFE_BATCH_SIZE: "100"
    MAGENTO_HTTPS_MAX_SOCKETS: "10"
    MAGENTO_MAX_RETRIES: "1"
    MAGENTO_CHUNK_DELAY_MS: "1000"
    MAGENTO_BATCH_DELAY_MS: "1000"
    CRON_SKU_COST_ALERT_ENABLED: "true"
    CRON_SKU_COST_ALERT_SCHEDULE: "30 1 * * *"
    SKU_COST_ALERT_SKU: "TH-635801"
    SKU_COST_ALERT_VENDOR: "Meyer"
    CRON_CAD_US_WEEKLY_ENABLED: "true"
    CRON_CAD_US_WEEKLY_SCHEDULE: "30 6 * * 0"
    CRON_TEST_ENABLED: "true"
    
    CRON_TEST_SCHEDULE: "5,35 * * * *"
    CRON_TEST_COMMAND: seed-orders
    CRON_TEST_JOB_NAME: Orders Update Test (30 min)
    CRON_TEST_LOG_FILE: prisma/seeds/logs/seed-orders-30min-test.log
    CRON_TEST_NOTIFY_ON_SUCCESS: "false"
    SEED_ORDER_LIMIT: "200"
    CRON_CANCELLATION_REPORT_ENABLED: "true"
    CRON_CANCELLATION_REPORT_SCHEDULE: "59 23 * * *"
    CRON_CANCELLATION_REPORT_TIMEZONE: America/Toronto
    CRON_SKU_STATUS_REPORT_ENABLED: "true"
    CRON_SKU_STATUS_REPORT_SCHEDULE: "0 22 * * *"
    CRON_SKU_STATUS_REPORT_TIMEZONE: America/Toronto
    CRON_SKU_STATUS_WEEKLY_REPORT_ENABLED: "true"
    CRON_SKU_STATUS_WEEKLY_REPORT_SCHEDULE: "0 18 * * 5"
    CRON_SKU_STATUS_WEEKLY_REPORT_TIMEZONE: America/Toronto
    CRON_DIGEST_ENABLED: "true"
    CRON_DIGEST_SCHEDULE: "10 0 * * *"
    CRON_DIGEST_TIMEZONE: America/Toronto
    # QuickBooks customer lookup: data served from Postgres (imported via
    # seed-quickbooks-customers). "csv" = legacy fallback reading the CSVs from
    # the quickbooks-inbox volume. See docs/QUICKBOOKS-DATA-REFRESH.md.
    QB_LOOKUP_SOURCE: "db"
    QB_LOOKUP_DATA_DIR: "/data/quickbooks-customers"
    CRON_QB_FRESHNESS_REPORT_ENABLED: "true"
    CRON_QB_FRESHNESS_REPORT_SCHEDULE: "15 9 * * *"
    QB_STALE_WARN_DAYS: "14"
    QB_STALE_CRIT_DAYS: "30"
    CRON_HISTORY_LOOKBACK_DAYS: "30"
    CRON_HISTORY_RETENTION_DAYS: "90"
    CRON_LOG_TAIL_LINES: "300"
    JWT_EXPIRES_IN: 24h
    PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    # E-mail routing is NOT a secret: it stays in clear so it never resolves
    # empty from a shell without source (ECONNREFUSED 127.0.0.1:587 incident on
    # Jul 20: the container came up with an empty SMTP_HOST and nodemailer fell
    # back to the localhost:587 default). Credentials stay in secret.
    EMAIL_PROVIDER: smtp
    EMAIL_FROM: JustJeeps API <webdev@justjeeps.com>
    SMTP_HOST: smtp-relay.brevo.com
    SMTP_PORT: "2525"
    SMTP_SECURE: "false"
    # Vendor feeds in Spaces (bucket provisioned on 2026-08-05).
    # 4:47/16:47 = off the delta */5 grid and with room before seed-all
    # (7:32/19:32): global cron mutex. The Keystone FTP drops long transfers
    # (426), so byte-level resume plus generous retries.
    CRON_FEED_FETCH_KEYSTONE_ENABLED: "true"
    CRON_FEED_FETCH_KEYSTONE_SCHEDULE: "47 4,16 * * *"
    KEYSTONE_FTP_MAX_ATTEMPTS: "12"
    # Keystone FTPS intermediate CA: the server only sends the leaf, so Node
    # needs the intermediate to build the chain. It lives in a private directory
    # of the bucket (never in the repository); an alternative is
    # KEYSTONE_FTP_CA_PEM as a secret holding the PEM content.
    KEYSTONE_FTP_CA_OBJECT_KEY: certs/keystone-ftp-ca.pem
    # Who can do what: allowlists via env so that a code deploy is not needed
    # when someone joins or leaves the team (the code only holds the default).
    MAGENTO_STATUS_ALLOWED_USERS: "jerry,tess,jacob,david,rafael,ricardo,paula"
    ORDER_CANCEL_EXECUTE_ALLOWED_USERS: "tess,jerry,jacob,paula,karoline"
    ORDER_CANCEL_DRY_RUN_ALLOWED_USERS: "tess"
    ORDER_CANCEL_MANUAL_REFUND_RESTRICTED_USERS: "paula"
    ORDER_PO_INIT_ALLOWED_USERS: "tess,jerry,jacob,paula,karoline"
    PURCHASER_REPORT_ALLOWED_USERS: "tess,paula,karoline"
    ORDER_CANCELLATION_REPORT_ALLOWED_USERS: "tess,jerry,jacob,paula,karoline"
    # Origins accepted by the browser (API CORS). localhost only outside prod.
    CORS_ALLOWED_ORIGINS: "https://pricingtool.justjeeps.com"
    FEED_CACHE_DIR: /app/feed-cache
    # Who can upload a feed and use the panel "Run now" button.
    FEEDS_TRIAGE_USERS: "admin,ricardo,tess"
    # Requests (internal tickets): rollout gate while the team tests the
    # feature. Release = widen this list (or list the whole team).
    REQUESTS_ALLOWED_USERS: "ricardo,admin,tess"
    # Who can close. Usernames are not secret; kept in clear so the value
    # never resolves empty (config/requests.js).
    REQUESTS_TRIAGE_USERS: "ricardo,admin,tess"
    REQUESTS_ASSIGNMENT_EMAIL_ENABLED: "true"
    # Requests digest: opt-in (enable after the meeting decides schedule and
    # recipients). Recipients live in REQUESTS_DIGEST_EMAILS (secret).
    CRON_REQUESTS_DIGEST_ENABLED: "false"
    CRON_REQUESTS_DIGEST_SCHEDULE: "0 8 * * 1-5"
    CRON_REQUESTS_DIGEST_TIMEZONE: America/Toronto
    # Trello one-way (card created on assignment): configured 100% in the
    # database via the /settings panel (global credential + board per user).
  secret:
    # Database & Auth
    - DATABASE_URL
    - JWT_SECRET
    - USD_TO_CAD_RATE
    # Email credentials & notifications (non-secret routing lives in clear)
    - EMAIL_USER
    - EMAIL_PASSWORD
    - SMTP_USER
    - SMTP_PASSWORD
    - SENDGRID_API_KEY
    - BREVO_API_KEY
    - BREVO_FROM
    - CRON_NOTIFICATION_EMAIL
    - ORDER_CANCELLATION_REPORT_EMAILS
    - SKU_STATUS_REPORT_EMAILS
    - SKU_STATUS_WEEKLY_REPORT_EMAILS
    - REQUESTS_DIGEST_EMAILS
    # Magento
    - MAGENTO_KEY
    # Keystone
    - KEYSTONE_KEY
    - KEYSTONE_ACCOUNT
    - KEYSTONE_ACCOUNT_DS
    - KEYSTONE_KEY_DS
    - KEYSTONE_FTP_USER
    - KEYSTONE_FTP_PASS
    # Meyer
    - MEYER_USERNAME
    - MEYER_PASSWORD
    - MEYER_KEY
    # Turn14
    - TURN14_CLIENT_ID
    - TURN14_CLIENT_SECRET
    - TURN14_ENVIRONMENT
    # Premier
    - PREMIER_API_KEY
    - PREMIER_BASE_URL
    # WheelPros
    - WHEELPROS_USER
    - WHEELPROS_PASS
    # Other APIs
    - PARSEHUB_KEY_NORTHRIDGE
    - FREIGHTCOM_API_KEY
    # DigitalOcean Spaces (vendor feeds + request attachments). Required since
    # the feeds pipeline went live; request attachments use the same bucket.
    - DO_SPACES_ENDPOINT
    - DO_SPACES_REGION
    - DO_SPACES_BUCKET
    - DO_SPACES_KEY
    - DO_SPACES_SECRET
    # Axiom (Error Monitoring)
    - AXIOM_TOKEN
    - AXIOM_DATASET

# =============================================================================
# SSH
# =============================================================================
ssh:
  user: root

# =============================================================================
# BUILDER
# =============================================================================
builder:
  arch: amd64
  dockerfile: Dockerfile.production
  context: .

volumes:
  - "/var/lib/justjeeps-api/logs:/app/logs"
  - "/var/lib/justjeeps-api/prisma-seeds-logs:/app/prisma/seeds/logs"
  # The CAD-US audit/disable CSVs must survive deploys (disable reads the CSV
  # produced by audit). Before the first deploy with this volume, create the dir
  # on the host owned by the container nodejs user (same uid as the log volumes
  # above): mkdir -p /var/lib/justjeeps-api/reports && chown <uid>:<gid>
  - "/var/lib/justjeeps-api/reports:/app/reports"
  # Inbox for the QuickBooks Desktop exports (customers_qb_desktop.csv +
  # transactions_per_customer.csv). Mounted on a path WITHOUT spaces (the Kamal
  # docker run does not quote volumes; "/app/QuickBooks Project/..." breaks the
  # deploy). The service resolves it via the QB_LOOKUP_DATA_DIR env. Bootstrap
  # before the first deploy: mkdir + copy the CSVs + chown to the nodejs uid.
  # Refresh: scp the new CSVs to the dir on the host and run
  # seed-quickbooks-customers. See docs/QUICKBOOKS-DATA-REFRESH.md.
  - "/var/lib/justjeeps-api/quickbooks-inbox:/data/quickbooks-customers"
  # Local cache of the vendor feeds materialized from Spaces (lib/feeds).
  # Pure cache: if the host loses the dir, the materializer re-downloads it from
  # the bucket. Bootstrap before the first deploy:
  # mkdir -p /var/lib/justjeeps-api/feed-cache && chown <uid>:<gid> (same nodejs
  # uid as the volumes above).
  - "/var/lib/justjeeps-api/feed-cache:/app/feed-cache"
