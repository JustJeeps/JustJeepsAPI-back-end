# CI minimo: pega a classe de regressao do commit 81047cf (cron agendando npm
# script inexistente) e quebras de sintaxe/schema antes de chegarem ao deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify cron definitions vs npm scripts (verify-cron)
        run: npm test

      - name: Syntax check entrypoints
        run: |
          node --check server.js
          node --check config/cron-jobs.js
          for f in scripts/*.js; do node --check "$f"; done

      - name: Validate Prisma schema
        run: npx prisma validate --schema=prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
