# =============================================================================
# JustJeeps API - Development Docker Compose Configuration
# =============================================================================
# Use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# SECURITY: Requires .env file - copy from .env.example
# =============================================================================

services:
  db:
    ports:
      - "${DB_PORT:-5433}:5432"

  api:
    build:
      context: .
      target: builder
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      ENABLE_AUTH: ${ENABLE_AUTH:-false}
      CRON_ENABLED: "false"
      CRON_MAGENTO_ATTRIBUTES_PRIORITY_ENABLED: "false"
      CRON_MAGENTO_ATTRIBUTES_ROUGH_ENABLED: "false"
      AUDIT_CAD_US_CONCURRENCY: "2"
      AUDIT_CAD_US_MAX_RPM: "60"
      MAGENTO_MAX_SAFE_CONCURRENCY: "1"
      MAGENTO_CHUNK_DELAY_MS: "1000"
      MAGENTO_BATCH_DELAY_MS: "1000"
      MAGENTO_MAX_RETRIES: "1"
    command: npm run dev
